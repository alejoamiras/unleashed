name: Setup Forge
description: |
  Install the pinned Foundry and the bridge's pinned forge libraries, write remappings.txt, and with
  `build: "true"` restore the last build of contracts/bridge/evm and bring it up to date.
  Callers must check out the repo and run setup-bun first: the remappings resolve through
  bridge-core's installed packages.

inputs:
  build:
    description: >
      "true" restores contracts/bridge/evm's out/ and cache/ and runs an incremental `forge build`.
      The forge job leaves it "false" and builds from scratch, so the contract gate never depends
      on a cached build.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Pinned, not `stable`: a newer Foundry routes test-contract creation through the
    # deployCode(string,bytes) cheatcode, which halmos 0.3.3 does not implement — setUp then
    # finds no successful path and every proof fails. This is the version the suites were
    # validated against. Bump it deliberately, re-running halmos when you do. 1.8.1 was tried
    # with halmos 0.3.3: 0 of 12 proofs pass, and the gas snapshot moves by 8%.
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: "1.7.1"
        # That cache holds RPC responses for fork tests, and no CI job runs one.
        cache: false

    # Keyed on this file, which holds the pins below: a pin bump misses and reinstalls.
    - name: Cache forge libraries
      id: lib-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: contracts/bridge/evm/lib
        key: ${{ runner.os }}-forge-lib-${{ hashFiles('.github/actions/setup-forge/action.yml') }}

    # lib/ is gitignored and installed per-checkout. Pinned to COMMITS, not floating tags, and the
    # README's install names the same ones (scripts/ci-cd/forge-pins.test.ts): a different
    # forge-std than the one the suites were validated against is a silent divergence — an older
    # one made halmos abort in setUp with "Unsupported cheat code", passing nothing.
    #
    # v4-core MUST stay v4.0.0: >=1.0.0 moves the SwapParams and ModifyLiquidityParams structs
    # the fuel contracts use.
    #
    # --no-git: the same files as a submodule install, without the .git links into a .git/modules
    # that a restored cache would not carry.
    - name: Install forge libraries
      if: steps.lib-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: contracts/bridge/evm
      run: |
        forge install --no-git \
          foundry-rs/forge-std@bf647bd6046f2f7da30d0c2bf435e5c76a780c1b \
          OpenZeppelin/openzeppelin-contracts@cab19933c33c2ad1d4c7a84864a3601dddfd16f3 \
          Uniswap/v4-core@e50237c43811bd9b526eff40f26772152a42daba

    # foundry.toml's @aztec/ and @aztec-blob-lib/ remaps assume a hoisted node_modules;
    # this repo uses bun's isolated linker, so the generated remappings.txt is what makes
    # the project resolve at all.
    - name: Generate remappings
      shell: bash
      run: bun packages/bridge-core/scripts/gen-remappings.ts

    # Exact key only, no restore-keys: forge never deletes the artifact of a removed source, so a
    # partial restore could hand the deploy a contract the tree no longer has and pass where a fresh
    # checkout fails. Every saved build therefore started from an empty out/, and the key is a digest
    # of every build input's path and contents: the pins and Foundry above, the lockfile
    # (node_modules sources), the remappings generator, the config and the sources. Not hashFiles(),
    # which digests contents alone, so a rename that kept the sort order would keep the key.
    - name: Digest the build inputs
      if: inputs.build == 'true'
      id: build-inputs
      shell: bash
      run: |
        digest=$(find contracts/bridge/evm/src contracts/bridge/evm/test contracts/bridge/evm/script -type f -print0 \
          | LC_ALL=C sort -z \
          | xargs -0 sha256sum -- .github/actions/setup-forge/action.yml bun.lock \
            packages/bridge-core/scripts/gen-remappings.ts contracts/bridge/evm/foundry.toml \
          | sha256sum | cut -d' ' -f1)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Cache the forge build
      if: inputs.build == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          contracts/bridge/evm/out
          contracts/bridge/evm/cache
        key: ${{ runner.os }}-forge-build-${{ steps.build-inputs.outputs.digest }}

    - name: forge build
      if: inputs.build == 'true'
      shell: bash
      run: forge build --root contracts/bridge/evm
