name: _tools-e2e

# Reusable: one shard of the tools browser suite against its own sandbox (anvil + local network).
# Called with a shard index by pr-tools-e2e.yml; every shard boots and reaps its own network.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test
        required: true
        type: string
      shard:
        description: Playwright shard, e.g. 1/6
        required: true
        type: string
      shard_label:
        description: A filename-safe name for this shard's artifacts, e.g. 1-of-6
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: tools e2e (${{ inputs.shard }})
    runs-on: ubuntu-latest
    # Shards split by recorded duration (apps/tools/tests/browser/shard-durations.json), so each runs
    # about a sixth of the suite after about 3 minutes of setup; 45 is headroom for a slow runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-bun

      # The sandbox runs on bridge-core's @aztec line — the node the tools build talks to.
      - name: Resolve bridge-core's Aztec pin
        id: aztec-pin
        run: |
          VERSION=$(bun -e "const v=JSON.parse(require('fs').readFileSync('packages/bridge-core/package.json','utf8')).dependencies['@aztec-labs/aztec.js']; if(!v) throw new Error('bridge-core pins no @aztec-labs/aztec.js'); console.log(v)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-aztec
        with:
          version: ${{ steps.aztec-pin.outputs.version }}

      # The generation the sandbox deploys is built from these artifacts.
      - uses: ./.github/actions/setup-forge
        with:
          build: "true"

      - uses: ./.github/actions/setup-playwright

      - name: Browser suite (shard ${{ inputs.shard }})
        run: bun run e2e:tools -- --shard=${{ inputs.shard }}

      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-e2e-${{ inputs.shard_label }}
          path: |
            apps/tools/.e2e-state/*/test-results/**
            apps/tools/.e2e-state/*/sandbox.log
            apps/tools/.e2e-state/*/build-*.log
            ~/.cache/unleashed/bridge-sandbox/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
