# Bun configuration. Docs: https://bun.com/docs/runtime/bunfig

[install]
# Isolated linker: per-workspace symlinked node_modules + a .bun store. Kills phantom
# dependencies (a workspace resolves ONLY what it declares). Whatever would assume a hoisted
# layout (the foundry @aztec/ remap, package-file lookups, bridge-core script paths) is
# layout-agnostic via @nulo-sh/resolve-asset + generated remappings; the executable
# guarantee is packages/bridge-core/scripts/layout-identity.test.ts.
# `globalStore` is DELIBERATELY unset (defaults off): the committed layout uses per-project
# hardlinked stores, so CI never creates or restores a shared symlink store
# (~/.bun/install/cache/links). A machine with many checkouts may opt in via its
# user-level ~/.bunfig.toml.
linker = "isolated"

# Supply-chain defense: block packages published in the last 7 days.
# Recent npm token-compromise attacks (axios, chalk/debug)
# were detected and pulled within hours-to-days; a 7-day window catches
# the publish-and-pull-within-hours attack pattern with margin.
#
# Why 7 days: Bun 1.3.1 erroneously gated frozen-lockfile installs of
# already-pinned versions, and 7d was the widest window that passed.
# Retested on Bun 1.4.0: that bug is gone — a 14d gate passes
# `bun install --frozen-lockfile` cleanly against this lockfile. Widening
# to 14d is viable; it would be a deliberate policy change.
#
# CVE bypass: when an advisory drops for a package newer than the gate,
# temporarily add a `minimumReleaseAgeExcludes = ["<name>"]` entry here,
# install the patched version, then delete the entry again in the same PR.
# See SECURITY.md "Dependency policy". No exemption is active: a frozen
# install never re-gates, so the exclude comes out as soon as bun.lock holds
# the young version (verified with `--frozen-lockfile --force`). The cost,
# until that version is 7 days old: a package.json edit in a workspace that
# reaches it re-gates it and fails. Wait, or add the exclude locally and do
# not commit it.
#
# Bun bug #25305 (`bun update --latest` skipped this gate for transitive
# deps on 1.3.x) is CLOSED on Bun 1.4.0 — verified with a
# positive-control mock-registry probe: when a gated update actually
# re-resolves, directs AND transitives are both held to the gate.
# The old "delete bun.lock first" workaround is retired. One nuance
# remains BY DESIGN: update never re-gates versions already in bun.lock
# (docs: the gate "only affects new package resolution"), so evicting a
# too-young version that is already locked still takes a deliberate
# lockfile regeneration.
#
# CLI equivalent: --minimum-release-age=604800
minimumReleaseAge = 604800
